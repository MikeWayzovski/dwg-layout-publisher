name: Build Windows exe

on:
  push:
    branches: [master, main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Test
        run: python -m pytest

      - name: Download LibreDWG 0.13.4 win64
        shell: pwsh
        run: |
          $url = "https://github.com/LibreDWG/libredwg/releases/download/0.13.4/libredwg-0.13.4-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile libredwg.zip
          Expand-Archive libredwg.zip -DestinationPath vendor/libredwg-src
          New-Item -ItemType Directory -Force vendor/libredwg | Out-Null
          Get-ChildItem -Path vendor/libredwg-src -Recurse -File |
            Where-Object { $_.Extension.ToLower() -in ".exe", ".dll" } |
            Copy-Item -Destination vendor/libredwg
          if (-not (Test-Path vendor/libredwg/dwg2dxf.exe)) {
            Get-ChildItem -Path vendor/libredwg-src -Recurse -File | Select-Object -ExpandProperty FullName
            throw "dwg2dxf.exe not found in the LibreDWG archive"
          }

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onedir --console
          --name DwgLayoutPublisher
          --add-data "vendor/libredwg;libredwg"
          --collect-all ezdxf
          --collect-all pymupdf
          --collect-all PIL
          main.py

      - name: Zip distribution
        shell: pwsh
        run: Compress-Archive -Path dist/DwgLayoutPublisher -DestinationPath DwgLayoutPublisher-win64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DwgLayoutPublisher-win64
          path: DwgLayoutPublisher-win64.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: DwgLayoutPublisher-win64.zip
